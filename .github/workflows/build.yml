name: Compile & Test


permissions:
  actions: write
  contents: read

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

env:
  BUILD_TYPE: Debug
  BUILDMASTER_VERBOSE: 1

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang, clang-libc++]
        cryptopp: [SYSTEM, BUNDLED]
        bzip2: [SYSTEM, BUNDLED]
        exclude:
          - compiler: clang-libc++
            cryptopp: SYSTEM
          - compiler: clang-libc++
            bzip2: SYSTEM
    name: linux-${{ matrix.compiler }}-cryptopp(${{ matrix.cryptopp }})-bzip2(${{ matrix.bzip2 }})
    env:
      LD_LIBRARY_PATH: ${{ github.workspace }}/build/thirdparty/buildmaster/install/lib:${{ github.workspace }}/build/lib
      CXXFLAGS: -DSTORMBYTE_CRYPTO_INSECURE_PBKDF2_ITERATIONS_FOR_CI

    steps:
      - name: Checkout repository and submodules
        uses: stormbytepp/githubactions/.github/actions/checkout-cached@master
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install OpenSSL (CLI for KeyPair fixtures)
        uses: stormbytepp/githubactions/.github/actions/install-cached@master
        with:
          packages: 'openssl'
          cache-key: apt-openssl-v1

      - name: Install CryptoPP (system)
        if: matrix.cryptopp == 'SYSTEM'
        uses: stormbytepp/githubactions/.github/actions/install-cached@master
        with:
          packages: 'libcrypto++-dev'
          cache-key: apt-cryptopp-v1

      - name: Install Bzip2 (system)
        if: matrix.bzip2 == 'SYSTEM'
        uses: stormbytepp/githubactions/.github/actions/install-cached@master
        with:
          packages: 'libbz2-dev'
          cache-key: apt-bzip2-v1

      - name: Build with toolchain
        uses: stormbytepp/githubactions/.github/actions/build-with-toolchain@master
        with:
          toolchain: ${{ matrix.compiler }}
          ccache-key: v1
          build-type: ${{ env.BUILD_TYPE }}
          configure-options: >-
            -DENABLE_ASAN=ON
            -DENABLE_TEST=ON
            -DWITH_CRYPTOPP=${{ matrix.cryptopp }}
            -DWITH_BZIP2=${{ matrix.bzip2 }}
            -DWITH_STORMBYTE=BUNDLED
            ${{ matrix.compiler == 'clang-libc++' && '-DCMAKE_CXX_FLAGS=-stdlib=libc++' || '' }}
          run-tests: true
          ctest-options: --output-on-failure --test-dir ${{ github.workspace }}/build/test

  build-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    name: macos-${{ matrix.compiler == 'clang' && 'clang-libc++' || matrix.compiler }}
    env:
      DYLD_LIBRARY_PATH: ${{ github.workspace }}/build/thirdparty/buildmaster/install/lib:${{ github.workspace }}/build/lib
      CXXFLAGS: -DSTORMBYTE_CRYPTO_INSECURE_PBKDF2_ITERATIONS_FOR_CI

    steps:
      - name: Checkout repository and submodules
        uses: stormbytepp/githubactions/.github/actions/checkout-cached@master
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install OpenSSL (Homebrew via install-cached)
        uses: stormbytepp/githubactions/.github/actions/install-cached@master
        with:
          packages: 'openssl@3'

      # keg-only: put OpenSSL 3 tools ahead of system LibreSSL
      - name: Put Homebrew OpenSSL on PATH
        run: |
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
          openssl version

      - name: Build with toolchain
        uses: stormbytepp/githubactions/.github/actions/build-with-toolchain@master
        with:
          toolchain: ${{ matrix.compiler }}
          ccache-key: v1
          build-type: ${{ env.BUILD_TYPE }}
          configure-options: >-
            -DENABLE_ASAN=ON
            -DENABLE_TEST=ON
            -DWITH_CRYPTOPP=BUNDLED
            -DWITH_BZIP2=BUNDLED
            -DWITH_STORMBYTE=BUNDLED
          run-tests: true
          ctest-options: --output-on-failure --test-dir ${{ github.workspace }}/build/test

  build-windows:
    runs-on: windows-latest
    name: windows-msvc
    env:
      CXXFLAGS: /DSTORMBYTE_CRYPTO_INSECURE_PBKDF2_ITERATIONS_FOR_CI

    steps:
      - name: Checkout repository and submodules
        uses: stormbytepp/githubactions/.github/actions/checkout-cached@master
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install OpenSSL (Chocolatey via install-cached)
        uses: stormbytepp/githubactions/.github/actions/install-cached@master
        with:
          packages: 'openssl'

      - name: Verify OpenSSL on PATH
        shell: pwsh
        run: |
          # install-cached already appends Chocolatey bin (shims).
          # If the package only installs under Program Files, add common locations.
          foreach ($p in @(
            "C:\Program Files\OpenSSL-Win64\bin",
            "C:\Program Files\OpenSSL\bin"
          )) {
            if (Test-Path $p) {
              echo $p | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
          }
          openssl version

      - name: Build with toolchain
        uses: stormbytepp/githubactions/.github/actions/build-with-toolchain@master
        with:
          toolchain: msvc
          ccache-key: v1
          build-type: ${{ env.BUILD_TYPE }}
          configure-options: >-
            -DENABLE_TEST=ON
            -DWITH_CRYPTOPP=BUNDLED
            -DWITH_BZIP2=BUNDLED
            -DWITH_STORMBYTE=BUNDLED
          run-tests: false

      - name: Add DLL directories to PATH
        shell: pwsh
        run: |
          echo "${{ github.workspace }}\build\lib" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "${{ github.workspace }}\build\thirdparty\buildmaster\install\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "${{ github.workspace }}\build\thirdparty\buildmaster\install\lib" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run unit tests
        shell: pwsh
        run: |
          ctest --output-on-failure --test-dir "${{ github.workspace }}\build\test"